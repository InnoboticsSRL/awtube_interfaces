name: Build

on:
  push:
    branches:
      - humble
  pull_request:
    branches:
      - humble

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Containerized Build
        uses: ./.github/actions/build

      - name: Create Pull Request from humble to humble-release
        if: success()
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Merge changes from humble to humble-release"
          body: |
            🚀 The build on `humble` has completed successfully!
            This is an automatic pull request to merge `humble` with `humble-release` to release the `.deb` package.
          base: humble-release  # Target branch
          branch: humble        # Source branch
          draft: true